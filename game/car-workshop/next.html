<!doctype html>

<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garage & Drive – Next</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><style>html,body{height:100%;margin:0;background:#09121f;color:#edf7ff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column}header,.hud,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#142439}header h1{margin:0;font-size:1.15rem}a{color:#64e4cb}.hud{flex-wrap:wrap}.hud p{margin:0;flex:1;min-width:230px}.hud strong{color:#64e4cb}button{background:#56dbc2;color:#061b1b;border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid white}#view{flex:1;min-height:300px;position:relative}#view canvas{display:block}.controls{justify-content:center;flex-wrap:wrap}.controls button{min-width:65px;touch-action:none}#speed{min-width:120px;text-align:center}#message{color:#fff3a2}#fallback{position:absolute;inset:20px auto auto 20px;background:#812b2b;padding:12px;display:none}@media(max-width:600px){header,.hud,.controls{padding:9px}button{padding:10px}.controls button{flex:1}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script></head><body><header><h1>Garage & Drive · Next</h1><a href="index.html">Alte Version</a></header><div class="hud"><p id="message" role="status">Auftrag: Bremse vorne rechts prüfen. Klicke auf ein Rad.</p><strong id="speed">Werkstatt</strong><button id="action" disabled>Diagnose</button><button id="reset">Neustart</button></div><div id="view"><div id="fallback" role="alert"></div></div><div class="controls"><span>Fahren: WASD / Pfeile · C: Kamera</span><button data-key="arrowleft">◀</button><button data-key="arrowup">Gas</button><button data-key="arrowdown">Bremse</button><button data-key="arrowright">▶</button><button id="camera">Kamera</button></div><script type="module">
// 2026-10-01 11:39 CEST: Three.js-Gameplay, Raycast-Radauswahl, Fahrsteuerung und Touch-Tasten ergänzt.
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),host=$('view'),keys=new Set(),ray=new T.Raycaster(),pointer=new T.Vector2();
let phase='inspect',chosen=null,speed=0,travel=0,heading=0,cameraMode=0,last=0;const wheels=[];
const scene=new T.Scene();scene.background=new T.Color('#20334a');scene.fog=new T.Fog('#20334a',30,95);
const cam=new T.PerspectiveCamera(60,1,.1,180);cam.position.set(6,5,8);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;host.append(renderer.domElement);
const orbit=new OrbitControls(cam,renderer.domElement);orbit.target.set(0,1,0);orbit.enableDamping=true;orbit.minDistance=3;orbit.maxDistance=14;orbit.maxPolarAngle=1.48;
const material=(c,m=0,r=.55)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});const red=material('#c84949',.55,.27),dark=material('#111820'),steel=material('#98abb9',.7,.3),glass=material('#46708a',.25,.2),road=material('#333c48'),mint=material('#55dfc6',.3,.3);
function cube(parent,w,h,d,x,y,z,mat){const a=new T.Mesh(new T.BoxGeometry(w,h,d),mat);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;parent.add(a);return a}
scene.add(new T.HemisphereLight('#cce7ff','#283342',2));const sun=new T.DirectionalLight('#fff0d8',3);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
const ground=cube(scene,100,.15,100,0,-.12,0,material('#385341'));ground.castShadow=false;const garage=new T.Group();scene.add(garage);cube(garage,16,.15,16,0,-.01,0,material('#4a5663'));cube(garage,16,6,.25,0,2.9,-8,material('#293c51'));cube(garage,.25,6,16,-8,2.9,0,material('#293c51'));cube(garage,.25,6,16,8,2.9,0,material('#293c51'));for(const x of [-5,5])cube(garage,3,.14,.5,x,5.8,-4,mint);
const track=new T.Group();track.visible=false;scene.add(track);cube(track,18,.03,100,0,.01,-34,road);for(let z=-78;z<15;z+=8)cube(track,.12,.04,3,0,.05,z,material('#f7e8bb'));for(const x of [-8.8,8.8])cube(track,.2,.04,100,x,.05,-34,material('#f5e3bc'));
const car=new T.Group();scene.add(car);cube(car,2.2,.58,4.3,0,.85,0,red);cube(car,1.85,.57,2,0,1.39,-.25,red);cube(car,1.7,.04,1,0,1.71,-.25,glass);cube(car,1.75,.23,.55,0,1.45,1,glass);cube(car,1.75,.23,.55,0,1.45,-1.18,glass);
for(const x of [-1.16,1.16])for(const z of [-1.4,1.4]){const wheel=new T.Mesh(new T.CylinderGeometry(.4,.4,.29,24),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);wheel.castShadow=true;wheel.userData.wheel=true;wheel.userData.bad=x>0&&z>0;car.add(wheel);wheels.push(wheel);const rim=new T.Mesh(new T.CylinderGeometry(.24,.24,.3,24),steel);rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);rim.userData.wheel=wheel;car.add(rim);wheels.push(rim)}
for(const x of [-.78,.78]){cube(car,.34,.14,.04,x,.95,2.16,material('#fff3c2'));cube(car,.34,.14,.04,x,.95,-2.16,material('#e92930'))}
function msg(s){$('message').textContent=s}function select(w){if(chosen&&chosen.material===mint)chosen.material=dark;chosen=w;w.material=mint;$('action').disabled=false;msg(w.userData.bad?'Befund: Bremse vorne rechts verschlissen. Diagnose bestätigen.':'Dieses Rad ist in Ordnung. Weitere Räder prüfen.');$('action').textContent='Diagnose bestätigen'}
renderer.domElement.addEventListener('pointerdown',e=>{if(phase!=='inspect')return;const b=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(pointer,cam);const hit=ray.intersectObjects(wheels,false)[0];if(hit)select(hit.object.userData.wheel||hit.object)});
$('action').onclick=()=>{if(phase==='inspect'){if(!chosen?.userData.bad){msg('Fehler noch nicht gefunden: Prüfe das vordere rechte Rad.');return}phase='repair';$('action').textContent='Bremsbelag ersetzen';msg('Diagnose bestätigt. Ersetze jetzt den Bremsbelag vorne rechts.')}else if(phase==='repair'){phase='ready';chosen.material=dark;$('action').textContent='Probefahrt starten';msg('Belag ersetzt. Starte die Probefahrt über 300 Meter.')}else if(phase==='ready'){phase='drive';chosen=null;garage.visible=false;track.visible=true;car.position.set(0,0,6);orbit.enabled=false;$('action').disabled=true;msg('Probefahrt: Gas geben und 300 Meter zurücklegen.')} };
$('reset').onclick=()=>location.reload();$('camera').onclick=()=>cameraMode=(cameraMode+1)%3;
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);if(phase==='drive')e.preventDefault()}if(k==='c')cameraMode=(cameraMode+1)%3});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>keys.delete(k))});
function resize(){const w=host.clientWidth,h=host.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();
renderer.setAnimationLoop(t=>{const dt=Math.min((t-(last||t))/1000,.05);last=t;if(phase==='drive'){const gas=keys.has('w')||keys.has('arrowup'),brake=keys.has('s')||keys.has('arrowdown');speed=T.MathUtils.clamp(speed+(gas?13:brake?-25:-5)*dt,0,32);const steer=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));heading=T.MathUtils.clamp(heading+steer*dt*.55,-.5,.5);car.position.x=T.MathUtils.clamp(car.position.x+Math.sin(heading)*speed*dt,-7,7);car.position.z-=Math.cos(heading)*speed*dt;travel+=speed*dt;track.position.z=car.position.z+34;car.rotation.y=-heading;const offset=cameraMode===0?new T.Vector3(0,4,8):cameraMode===1?new T.Vector3(0,2.6,4):new T.Vector3(0,1.65,.65);cam.position.copy(car.position).add(offset);cam.lookAt(car.position.x,1,car.position.z-8);$('speed').textContent=`${Math.round(speed*3.6)} km/h · ${Math.min(300,Math.floor(travel))}/300 m`;if(travel>=300){phase='done';speed=0;msg('Auftrag abgeschlossen: Reparatur und Probefahrt bestanden!')}}else{orbit.update()}renderer.render(scene,cam)});
window.addEventListener('error',e=>{const f=$('fallback');f.textContent='Spiel-Fehler: '+e.message;f.style.display='block'});
</script></body></html>
